name: Generate RSS Feed

on:
  schedule:
    # 毎週金曜日 13:00 中国時間 (CST = UTC+8) → UTC 5:00
    - cron: '0 5 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    
    - name: Pythonをセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 依存パッケージをインストール
      run: |
        pip install requests beautifulsoup4 feedgen
    
    - name: RSSフィードを生成
      run: python generate_rss.py
    
    - name: 変更をコミットしてプッシュ
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add feed.xml
        git diff --staged --quiet || git commit -m "RSSフィードを自動更新 [skip ci]"
        git push
