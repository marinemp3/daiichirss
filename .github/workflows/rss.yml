name: Generate RSS Feed

on:
  schedule:
    # 毎週金曜日 13:00 中国時間 (CST = UTC+8) → UTC 5:00
    - cron: '0 5 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # keepalive アクションが GitHub API を利用するために必要

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
      with:
        # rebase を安全に行うため全履歴を取得
        fetch-depth: 0
    
    - name: Pythonをセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 依存パッケージをインストール
      run: |
        pip install requests beautifulsoup4 feedgen
    
    - name: RSSフィードを生成
      run: python generate_rss.py
    
    - name: 変更をコミットしてプッシュ
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add feed.xml
        git diff --staged --quiet || git commit -m "RSSフィードを自動更新 [skip ci]"
        # プッシュ前にリモートの変更を取り込む（競合回避）
        git pull --rebase origin ${{ github.ref_name }}
        git push
    
    # 60日間の無効化対策（keepalive）
    - name: Keepalive（ワークフロー無効化防止）
      if: always()
      uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
      with:
        COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
        TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
